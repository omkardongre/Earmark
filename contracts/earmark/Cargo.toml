[package]
name = "earmark"
description = "Budgets for Sputnik DAO treasuries: funded spending limits, approval tiers and escalation to DAO votes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build settings used by `cargo near build reproducible-wasm`
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-sandbox = "0.3"
near-api = "0.8.7"
tokio = { version = "1.54.1", features = ["full"] }
testresult = "0.4.2"
serde_json = "1.0.154"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(near)"]
